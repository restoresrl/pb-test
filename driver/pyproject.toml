[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pb-test-driver"
version = "0.1.0"
description = "Run a PowerBuilder executable, catch its runtime error dialog, read JUnit results, and drive its windows through UI Automation. MCP server and CLI."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Carlo Torrese", email = "carlo.torrese@re-store.it" }]
keywords = ["powerbuilder", "testing", "mcp", "ui-automation", "pywinauto"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    # Same ceiling as pb-orca-mcp: mcp 2.x removed mcp.server.fastmcp.
    "mcp>=1.0,<2",
    "click>=8.1",
    "pywinauto>=0.6.8",
    "Pillow>=10",
]

[project.urls]
Homepage = "https://github.com/restoresrl/pb-test"
Issues = "https://github.com/restoresrl/pb-test/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
pb-test = "pb_test_driver.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/pb_test_driver"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["pywinauto.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
